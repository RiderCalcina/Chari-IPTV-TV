<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0F172A;
        font-family: 'Roboto', sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      
      /* Grid */
      .grid-container {
        position: absolute;
        top: 200px;
        left: 100px;
        width: 1720px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
      }
      
      .channel-card {
        background: #1E293B;
        border-radius: 12px;
        aspect-ratio: 16/11;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      
      /* Overlay Text */
      .text-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        pointer-events: none;
      }
      
      .main-text {
        color: #FFFFFF;
        font-size: 80px;
        font-weight: 700;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        text-align: center;
      }
      
      /* Fullscreen Video Wrapper */
      #fullscreen-wrapper {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        z-index: 200;
      }
      
      #punchline-wrapper {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #0F172A;
        z-index: 300;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      
      <!-- Scene 1 & 2: Grid UI -->
      <div id="scene-grid" class="clip" data-start="0" data-duration="9" data-track-index="0">
        <div class="grid-container">
          <div class="channel-card" id="card-1"><span style="color:#60A5FA; font-size: 60px;">CH 1</span></div>
          <div class="channel-card" id="card-2"><span style="color:#60A5FA; font-size: 60px;">CH 2</span></div>
          <div class="channel-card" id="card-3"><span style="color:#60A5FA; font-size: 60px;">CH 3</span></div>
          <div class="channel-card" id="card-4"><span style="color:#60A5FA; font-size: 60px;">CH 4</span></div>
          
          <div class="channel-card" id="card-5"><span style="color:#60A5FA; font-size: 60px;">CH 5</span></div>
          <div class="channel-card" id="card-6"><span style="color:#60A5FA; font-size: 60px;">CH 6</span></div>
          <div class="channel-card" id="card-7"><span style="color:#60A5FA; font-size: 60px;">CH 7</span></div>
          <div class="channel-card" id="card-8"><span style="color:#60A5FA; font-size: 60px;">CH 8</span></div>
        </div>
        
        <div class="text-overlay">
          <div id="text-scene1" class="main-text">Live channels...</div>
        </div>
      </div>
      
      <div id="scene-grid-2" class="clip" data-start="4" data-duration="5" data-track-index="1">
         <div class="text-overlay">
          <div id="text-scene2" class="main-text">...that actually load.</div>
        </div>
      </div>
      
      <!-- Scene 3: Fullscreen Action -->
      <div id="scene-video" class="clip" data-start="9" data-duration="4" data-track-index="2">
        <div id="fullscreen-wrapper">
           <div class="text-overlay" style="align-items: flex-end; padding-bottom: 100px;">
              <div id="text-scene3" class="main-text" style="font-size: 60px;">Instant playback. Zero backend.</div>
           </div>
        </div>
      </div>
      
      <!-- Scene 4: Punchline -->
      <div id="scene-punchline" class="clip" data-start="13" data-duration="3" data-track-index="3">
        <div id="punchline-wrapper">
          <div id="text-scene4" class="main-text">Cero segundos de espera.</div>
          <div id="text-icon" style="font-size: 100px; margin-top: 40px;">📺</div>
        </div>
      </div>

    </div>
    
    <script>
      const tl = gsap.timeline({ paused: true });
      
      gsap.set("#text-scene1", { opacity: 0 });
      gsap.set("#text-scene2", { opacity: 0 });
      gsap.set("#text-scene3", { opacity: 0 });
      gsap.set("#text-scene4", { opacity: 0 });
      gsap.set("#text-icon", { opacity: 0 });
      gsap.set("#fullscreen-wrapper", { scale: 0, opacity: 0 });
      gsap.set("#punchline-wrapper", { opacity: 0 });
      
      // Scene 1:
      tl.fromTo("#card-1", { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B" }, { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155", duration: 0.2 }, 0.5);
      tl.fromTo("#text-scene1", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.5);
      
      tl.fromTo("#card-1", { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155" }, { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B", duration: 0.2 }, 1.5);
      tl.fromTo("#card-2", { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B" }, { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155", duration: 0.2 }, 1.5);
      
      tl.fromTo("#card-2", { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155" }, { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B", duration: 0.2 }, 2.5);
      tl.fromTo("#card-3", { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B" }, { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155", duration: 0.2 }, 2.5);
      
      tl.fromTo("#text-scene1", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.1, duration: 0.3 }, 3.7);
      
      // Scene 2: 
      tl.fromTo("#text-scene2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 4.0);
      
      tl.fromTo("#card-3", { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155" }, { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B", duration: 0.2 }, 4.5);
      tl.fromTo("#card-7", { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B" }, { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155", duration: 0.2 }, 4.5);
      
      tl.fromTo("#card-7", { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155" }, { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B", duration: 0.2 }, 6.5);
      tl.fromTo("#card-8", { scale: 1, borderColor: "transparent", borderWidth: 0, backgroundColor: "#1E293B" }, { scale: 1.15, borderColor: "#FFFFFF", borderWidth: 4, backgroundColor: "#334155", duration: 0.2 }, 6.5);
      
      tl.fromTo("#text-scene2", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.1, duration: 0.3 }, 8.7);
      
      // Scene 3: Expand to fullscreen
      tl.fromTo("#fullscreen-wrapper", { opacity: 0, scale: 0, borderRadius: "50%" }, { opacity: 1, scale: 1, borderRadius: "0%", duration: 0.6, ease: "power4.inOut" }, 9.0);
      tl.fromTo("#text-scene3", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6 }, 10.0);
      
      // Scene 4: Punchline
      tl.fromTo("#punchline-wrapper", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 13.0);
      tl.fromTo("#text-scene4", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6 }, 13.5);
      tl.fromTo("#text-icon", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 13.7);
      
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
